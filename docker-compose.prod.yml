# Production Multi-Container Compose Architecture (Tasks P16.14, P16.15, P16.16)
services:
  postgres:
    image: postgres:16-alpine
    container_name: examscheduler_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examscheduler_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeProdSecretPass123!}
      POSTGRES_DB: ${POSTGRES_DB:-examscheduler}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./scripts/init_db_roles.sql:/docker-entrypoint-initdb.d/01_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examscheduler_admin} -d ${POSTGRES_DB:-examscheduler}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examscheduler_prod_migrator
    command: python -m alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-examscheduler_admin}:${POSTGRES_PASSWORD:-ChangeMeProdSecretPass123!}@postgres:5432/${POSTGRES_DB:-examscheduler}
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examscheduler_prod_backend
    restart: always
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-examscheduler_admin}:${POSTGRES_PASSWORD:-ChangeMeProdSecretPass123!}@postgres:5432/${POSTGRES_DB:-examscheduler}
      JWT_SECRET: ${JWT_SECRET:-production_secure_jwt_secret_key_minimum_32_characters!}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://timetable.univ.edu}
      PORT: 8000
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - internal_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examscheduler_prod_frontend
    restart: always
    networks:
      - internal_net

  gateway:
    image: nginx:alpine
    container_name: examscheduler_prod_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/gateway_nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - internal_net

volumes:
  pgdata_prod:

networks:
  internal_net:
    driver: bridge
