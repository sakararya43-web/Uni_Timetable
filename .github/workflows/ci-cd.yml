name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and Format Verification (Ruff)
        run: |
          python -m ruff check backend/
          python -m ruff format --check backend/

      - name: Static Type Checking (Mypy)
        run: |
          python -m mypy --config-file backend/pyproject.toml backend/app

      - name: Execute Full Pytest Test Suite
        run: |
          python -m pytest backend/tests --cov=backend/app --cov-report=xml -v

  test-frontend:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Execute Vitest Component Suite
        run: |
          cd frontend
          npm run test:run

      - name: Verify TypeScript & Production Build
        run: |
          cd frontend
          npm run build

  build-containers:
    name: Docker Container Build Verification
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: examscheduler-backend:latest

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: examscheduler-frontend:latest

  deploy-staging:
    name: Staging Automated Deployment
    needs: [build-containers]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to Staging
        run: echo "Automated deployment to Staging environment completed."

  deploy-production:
    name: Production Deployment (Approval Required)
    needs: [deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Production
        run: echo "Production deployment triggered for release tag ${{ github.ref_name }}."
