name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: exam_scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Ruff Lint & Format Checks
        run: |
          python -m ruff check backend/
          python -m ruff format --check backend/

      - name: Run Mypy Strict Type Checking
        run: |
          python -m mypy --config-file backend/pyproject.toml backend/app

      - name: Run Pytest with Coverage
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/exam_scheduler_test
          JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_long
        run: |
          python -m pytest backend/tests --cov=backend/app/algorithms --cov-fail-under=95

      - name: Run Dependency Vulnerability Audit (non-blocking)
        continue-on-error: true
        run: |
          python -m pip_audit

  frontend-checks:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run ESLint
        working-directory: frontend
        run: |
          npm run lint

      - name: Run TypeScript Type Check
        working-directory: frontend
        run: |
          npm run typecheck

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: |
          npm run test:run

      - name: Run Frontend Production Build
        working-directory: frontend
        run: |
          npm run build
